[project]
site_name        = "Guide d'utilisation ATBClone"
site_url         = "https://clone.aitobox.com/fr/"
site_description = "Guide officiel ATBClone — Moteur de clonage multi-instances et d'isolation sandbox pour macOS"
repo_url         = "https://github.com/aitobox/ATBClone"
repo_name        = "aitobox/ATBClone"
docs_dir         = "fr"
site_dir         = "site/fr"

extra_javascript = [
  "javascripts/language-detector.js",
  "javascripts/ascii-diagram.js"
]
extra_css = [
  "stylesheets/extra.css"
]

nav = [
  { "Vue d'ensemble" = "README.md" },
  { "Chapitre 1 : Opérations de base et gestion des clones" = "01-basic-operations.md" },
  { "Chapitre 2 : Recettes personnalisées et paramètres de base" = "02-advanced-custom-recipes.md" },
  { "Chapitre 3 : Fonctionnement interne et paramètres avancés" = "03-under-the-hood-and-internals.md" },
  { "Chapitre 4 : FAQ, diagnostic système et commentaires" = "04-faq-and-troubleshooting.md" },
]

[project.theme]
name        = "material"
custom_dir  = "overrides"
language    = "fr"
logo        = "assets/images/logo.png"
favicon     = "assets/images/logo.png"
palette     = [
  { scheme = "default", primary = "light-blue", accent = "cyan", media = "(prefers-color-scheme: light)" },
  { scheme = "slate", primary = "light-blue", accent = "cyan", media = "(prefers-color-scheme: dark)" }
]
font        = { text = "Inter", code = "JetBrains Mono" }
features    = [
  "navigation.top",
  "search.highlight",
  "content.code.copy"
]

[project.extra]
multilingual = true
alternate = [
  { name = "English", link = "/en/", lang = "en" },
  { name = "简体中文", link = "/zh/", lang = "zh" },
  { name = "繁體中文", link = "/zh-hant/", lang = "zh-hant" },
  { name = "日本語", link = "/ja/", lang = "ja" },
  { name = "한국어", link = "/ko/", lang = "ko" },
  { name = "Deutsch", link = "/de/", lang = "de" },
  { name = "Français", link = "/fr/", lang = "fr" },
  { name = "Español", link = "/es/", lang = "es" },
  { name = "Русский", link = "/ru/", lang = "ru" }
]
forum_url = "https://github.com/aitobox/ATBClone/issues"
footer_links = [
  { text = "GitHub Releases", url = "https://github.com/aitobox/ATBClone/releases" },
  { text = "ATBCmder", url = "https://cmder.aitobox.com" },
  { text = "Signaler un problème & Retours", url = "https://github.com/aitobox/ATBClone/issues" }
]

[project.markdown_extensions]
admonition = {}
gfm_admonition = {}
abbr = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc = { permalink = true }
"pymdownx.arithmatex" = { generic = true }
"pymdownx.betterem" = {}
"pymdownx.caret" = {}
"pymdownx.details" = {}
"pymdownx.emoji" = { emoji_generator = "zensical.extensions.emoji.to_svg", emoji_index = "zensical.extensions.emoji.twemoji" }
"pymdownx.highlight" = { anchor_linenums = true, line_spans = "__span", pygments_lang_class = true }
"pymdownx.inlinehilite" = {}
"pymdownx.keys" = {}
"pymdownx.magiclink" = {}
"pymdownx.mark" = {}
"pymdownx.smartsymbols" = {}
"pymdownx.superfences" = { custom_fences = [{ name = "mermaid", class = "mermaid" }] }
"pymdownx.tabbed" = { alternate_style = true, combine_header_slug = true }
"pymdownx.tasklist" = { custom_checkbox = true }
"pymdownx.tilde" = {}

