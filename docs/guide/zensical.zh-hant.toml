[project]
site_name        = "ATBClone 使用者手冊"
site_url         = "https://clone.aitobox.com/zh-hant/"
site_description = "ATBClone（ATB分身助手）官方使用手冊 — macOS 應用程式多開與沙盒隔離引擎"
repo_url         = "https://github.com/aitobox/ATBClone"
repo_name        = "aitobox/ATBClone"
docs_dir         = "zh-hant"
site_dir         = "site/zh-hant"

extra_javascript = [
  "javascripts/language-detector.js",
  "javascripts/ascii-diagram.js",
  "https://unpkg.com/katex@0/dist/katex.min.js",
  "https://unpkg.com/katex@0/dist/contrib/auto-render.min.js",
  "javascripts/katex.js"
]
extra_css = [
  "stylesheets/extra.css",
  "https://unpkg.com/katex@0/dist/katex.min.css"
]

nav = [
  { "手冊總覽" = "README.md" },
  { "第一章：基礎操作與分身管理" = "01-basic-operations.md" },
  { "第二章：冷門應用規則定制與基礎參數" = "02-advanced-custom-recipes.md" },
  { "第三章：實現原理解析與高級參數全解" = "03-under-the-hood-and-internals.md" },
  { "第四章：常見問題 (FAQ)、系統體檢與反饋" = "04-faq-and-troubleshooting.md" },
]

[project.theme]
name        = "material"
custom_dir  = "overrides"
language    = "zh-Hant"
logo        = "assets/images/logo.png"
favicon     = "assets/images/logo.png"
palette     = [
  { scheme = "default", primary = "light-blue", accent = "cyan", media = "(prefers-color-scheme: light)" },
  { scheme = "slate", primary = "light-blue", accent = "cyan", media = "(prefers-color-scheme: dark)" }
]
font        = { text = "Inter", code = "JetBrains Mono" }
features    = [
  "navigation.top",
  "search.highlight",
  "content.code.copy"
]

[project.extra]
multilingual = true
alternate = [
  { name = "English", link = "/en/", lang = "en" },
  { name = "简体中文", link = "/zh/", lang = "zh" },
  { name = "繁體中文", link = "/zh-hant/", lang = "zh-hant" },
  { name = "日本語", link = "/ja/", lang = "ja" },
  { name = "한국어", link = "/ko/", lang = "ko" },
  { name = "Deutsch", link = "/de/", lang = "de" },
  { name = "Français", link = "/fr/", lang = "fr" },
  { name = "Español", link = "/es/", lang = "es" },
  { name = "Русский", link = "/ru/", lang = "ru" }
]
download_url = "https://storage.aitobox.com/@s/bNAshV6G/ATBClone"
forum_url = "https://github.com/aitobox/ATBClone/issues"
footer_links = [
  { text = "GitHub Releases", url = "https://github.com/aitobox/ATBClone/releases" },
  { text = "ATBCmder", url = "https://cmder.aitobox.com" },
  { text = "回報問題與建議", url = "https://github.com/aitobox/ATBClone/issues" }
]

[project.markdown_extensions]
admonition = {}
gfm_admonition = {}
abbr = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc = { permalink = true }
"pymdownx.arithmatex" = { generic = true }
"pymdownx.betterem" = {}
"pymdownx.caret" = {}
"pymdownx.details" = {}
"pymdownx.emoji" = { emoji_generator = "zensical.extensions.emoji.to_svg", emoji_index = "zensical.extensions.emoji.twemoji" }
"pymdownx.highlight" = { anchor_linenums = true, line_spans = "__span", pygments_lang_class = true }
"pymdownx.inlinehilite" = {}
"pymdownx.keys" = {}
"pymdownx.magiclink" = {}
"pymdownx.mark" = {}
"pymdownx.smartsymbols" = {}
"pymdownx.superfences" = { custom_fences = [{ name = "mermaid", class = "mermaid" }] }
"pymdownx.tabbed" = { alternate_style = true, combine_header_slug = true }
"pymdownx.tasklist" = { custom_checkbox = true }
"pymdownx.tilde" = {}

