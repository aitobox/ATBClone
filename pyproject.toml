[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "atbclone"
version = "2.3.1"
description = "macOS App Cloning Engine"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "AIToBox" }
]
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "briefcase==0.4.4",
]

[project.scripts]
atbclone = "atbclone.cli.main:cli"

[project.optional-dependencies]
dev = ["pytest", "pytest-mock", "ruff"]
gui = ["toga>=0.4.0", "requests>=2.28"]

[tool.briefcase]
project_name = "ATBClone"
bundle = "com.aitobox.atbclone"
version = "2.3.1"
url = "https://github.com/aitobox/ATBClone"
author = "AIToBox"
author_email = "clone@aitobox.com"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]

[tool.briefcase.app.atbclone]
formal_name = "ATBClone"
description = "macOS App Cloning Engine"
icon = "resource/images/logo"
sources = ["src/atbclone"]
resources = ["resource/images", "docs/release"]
requires = [
    "toga>=0.4.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "requests>=2.28",
]

[tool.briefcase.app.atbclone.macOS]
icon = "resource/images/logo"
requires = [
    "std-nslog",
]
