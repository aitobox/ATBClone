bundle_id: com.electron.lark
app_name: 飞书
strategy: hard_clone
app_type: electron
patch_framework_singleton: true
strip_sandbox: true
# --user-data-dir isolates the Electron SingletonLock per clone.
# Feishu hardcodes "LarkShell" as the Electron app name (in Lark Framework.framework,
# not the thin main binary), so NSHomeDirectory()-based HOME isolation is bypassed by
# macOS Cocoa APIs. Passing --user-data-dir is the only reliable way to separate the
# singleton socket/lock between original and clones.
launch_args:
  - '--user-data-dir={{ATB_DATA_DIR}}/UserData'
environment_injection:
  HOME: '{{ATB_DATA_DIR}}/Home'
  TMPDIR: '{{ATB_DATA_DIR}}/Tmp'
