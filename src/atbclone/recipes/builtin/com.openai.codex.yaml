bundle_id: com.openai.codex
app_name: ChatGPT
strategy: hard_clone
app_type: electron
strip_sandbox: true
patch_framework_singleton: true
environment_injection:
  HOME: '{{ATB_DATA_DIR}}/Home'
  TMPDIR: '{{ATB_DATA_DIR}}/Tmp'
  CODEX_HOME: '{{ATB_DATA_DIR}}/Codex'
symlink_whitelist:
- Library/Keychains

